[package]
name = "periph-app"
description = "Periph: Tauri shell that hosts the device drivers (Rapoo VT2 Max, VIA keyboards, ...)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "periph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
periph-core = { path = "../periph-core" }
dualsense-proto = { path = "../dualsense-proto", features = ["serde"] }
dualsense-vpad = { path = "../dualsense-vpad" }
hidhide = { path = "../hidhide" }
hidapi.workspace = true
vt2-proto = { path = "../vt2-proto", features = ["serde"] }
vt2-device = { path = "../vt2-device" }
via = { path = "../via" }
periph-pack = { path = "../periph-pack" }
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
resvg = { version = "0.50", default-features = false }

[target.'cfg(windows)'.dependencies]
# PnP tree walk (parent chain) to tell a real USB controller from an emulated one.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[features]
# Embed the built frontend (app/dist). Disable for `tauri dev` hot reload.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
