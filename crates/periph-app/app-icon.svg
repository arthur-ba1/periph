<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Periph app icon: a "P" whose bowl is a ring (the periphery) with one live device on it
       in the accent blue. Device-agnostic on purpose, so it stays legible at 16 px.
       The tile fills the whole canvas (no margin) so it matches other taskbar icons in size. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <g fill="none" stroke="#ffffff" stroke-width="112" stroke-linecap="round">
    <path d="M300 820V420"/>
    <circle cx="512" cy="420" r="212"/>
  </g>
  <!-- the live device: accent dot on the ring, cut out from the ring by a tile-colored halo -->
  <circle cx="662" cy="270" r="96" fill="url(#bg)"/>
  <circle cx="662" cy="270" r="66" fill="#3291ff"/>
</svg>
