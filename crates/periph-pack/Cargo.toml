[package]
name = "periph-pack"
description = "Device packages for Periph: declarative device descriptions loaded at runtime, and the engine that runs them"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "periph-pack"
path = "src/main.rs"

[dependencies]
periph-core = { path = "../periph-core" }
anyhow.workspace = true
hidapi.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vt2-proto = { path = "../vt2-proto" }
vt2-device = { path = "../vt2-device" }
